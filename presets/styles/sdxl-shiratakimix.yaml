# ShiratakiMix XL系向けの画風preset。
# 配布元がDPM++系のサンプラーとkarrasを推奨しており、Illustrious系の
# euler_ancestral / normal とはサンプラー設定の系統が違う。
# 解像度とseedは再現性に直結するため、styleでは指定せずSpec側に任せる。
#
# 配布元の推奨はsteps 20以上 / cfg 3-8 (配布元のサンプルは7.5) /
# dpmpp_3m_sde または dpmpp_2m_sde + karras。
# ただし2026-08-17に確認した時点では、civitai (マージレシピのみ) にも
# HuggingFace (Vsukiyaki/ShiratakiMix-XL) にもこの記載は見当たらず、裏を取れていない。
#
# clip skip 1 を明示する。SDXLは本来 penultimate layer を前提とし、
# Animagine XL 4.0はclip skip 2が無いと破綻する (Issue #135) が、
# このモデルは最終層 (clip skip 1) の方が結果がよい。clip skip 2にすると彩度が飽和し、
# 肌がオレンジへ転んで影が不自然になる (2026-08-17に同一seedで比較)。
# 指定を省くとComfyUI既定 (SDXLでは penultimate) になり clip skip 2 と同じ絵になるため、
# 省略ではなく明示する。マージ元の系統で最適が割れるので、モデルごとに実測して決める。
#
# SDE系のサンプラーはstepsを削ると収束せず、steps 8ではほぼ真っ白な画像になる。
# 動作確認のために負荷を落とす場合は sdxl-illustrious を使う。
#
# タグの選び方は sdxl-illustrious と同じ (実在するタグだけを使う)。

description: ShiratakiMix XL系の推奨設定。DPM++ 3M SDE / karrasで線を整える

prompt:
  positive: >
    masterpiece, best quality, absurdres, highres

  negative: >
    chibi, bad anatomy, bad hands, extra digits, worst quality,
    low quality, normal quality, lowres, blurry, jpeg artifacts, watermark, text,
    logo, signature, speech bubble, 3d, photorealistic, lens flare,
    film grain, realistic, monochrome, censored, multiple views

generation:
  sampler: dpmpp_3m_sde
  scheduler: karras
  cfg: 7.5
  steps: 28

model:
  clip_skip: 1
