# Animagine XL系 (animagineXL 4.0など) 向けの画風preset。
# Illustrious系とは品質タグの語彙もcfg / stepsの適正値も違うため、別のstyleとして分ける。
# 解像度とseedは再現性に直結するため、styleでは指定せずSpec側に任せる。
#
# 配布元の推奨はcfg 5-6 / steps 25 / euler_ancestral。cfgを7以上にすると線が焼き付く。
# 品質タグは `high score, great score` 系の語彙を使う。Illustrious系の
# `ultra-detailed, high res` とは学習語彙が異なるため流用しない。
#
# 対象のcheckpointは ~/ComfyUI/models/checkpoints/ へ未配置。使う前に配置する。

description: Animagine XL系の推奨設定。scoreタグ系の品質語彙を使う

prompt:
  positive: >
    masterpiece, high score, great score, absurdres

  negative: >
    lowres, bad anatomy, bad hands, extra fingers, worst quality, low quality,
    normal quality, blurry, jpeg artifacts, watermark, text, logo, signature,
    speech bubble, 3d, photorealistic, realistic, monochrome, censored,
    multiple views

generation:
  sampler: euler_ancestral
  scheduler: normal
  cfg: 6.0
  steps: 25
