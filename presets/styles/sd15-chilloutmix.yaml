# chilloutmix_NiPrunedFp16Fix.safetensors 向けの画風preset。
# 画風と品質タグ、それに合うサンプラー設定を書く。
# 解像度とseedは再現性に直結するため、styleでは指定せずSpec側に任せる。
# 照明はシーンの一部としてscene側で指定する。
#
# 推奨は steps 20前後 / cfg 7前後 / dpmpp_sde + karras
# (一覧は docs/prompting-guide.md の「配置済みのSD1.5系モデル」)。
#
# 配置済みのSD1.5系で唯一の写実寄りのモデル。アニメ調のstyle preset
# (anime-soft / anime-detailed / 他の sd15-*) を当てると品質タグが打ち消し合う。
# positiveの anime coloring を realistic へ差し替え、negativeへ回してアニメ調の塗りを抑える。
#
# photorealistic はpost_countが1,742と少ないため、より一般的な realistic を使う。
#
# cartoon はDanbooruに実在せず (post_count 0)、品質ラベルでもないため入れない。
# 同じ意味では anime coloring が効く。toon (style) は実在するが、括弧が
# プロンプトの強調記法と衝突するため使わない。
#
# SDE系のサンプラーはstepsを削ると収束しない。動作確認で負荷を落とす場合は
# stepsを下げずに解像度を落とす。

description: ChilloutMix向けの写実寄りポートレート。品質タグを写実側の語彙にする

prompt:
  positive: >
    masterpiece, best quality, absurdres, highres, realistic

  negative: >
    worst quality, low quality, lowres, bad anatomy, bad hands, extra digits,
    blurry, jpeg artifacts, text, watermark, signature, monochrome, sketch,
    anime coloring, multiple views

generation:
  sampler: dpmpp_sde
  scheduler: karras
  cfg: 7.0
  steps: 20
