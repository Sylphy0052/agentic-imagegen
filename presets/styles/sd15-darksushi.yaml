# darkSushiMixMix_225D.safetensors 向けの画風preset。
# 画風と品質タグ、それに合うサンプラー設定を書く。
# 解像度とseedは再現性に直結するため、styleでは指定せずSpec側に任せる。
# 照明はシーンの一部としてscene側で指定する。
#
# 推奨は steps 20-60 / cfg 7.5 / dpmpp_sde + karras
# (一覧は docs/prompting-guide.md の「配置済みのSD1.5系モデル」)。
# 汎用の anime-soft / anime-detailed は dpmpp_2m のためsamplerの系統が違う。
# 2.25D (2Dと2.5Dの中間) 寄りで陰影が濃く出る。
#
# SDE系のサンプラーはstepsを削ると収束しない。動作確認で負荷を落とす場合は
# stepsを下げずに解像度を落とす。

description: Dark Sushi Mix向け。陰影の濃い2.25D寄りのアニメ調

# サンプラー設定と品質タグはこのcheckpointに合わせて決めた値。別のcheckpointへ
# 流用すると噛み合わないため、対象を明示して validate で取り違えを警告させる。
applies_to:
  - darkSushiMixMix_225D.safetensors

prompt:
  positive: >
    masterpiece, best quality, absurdres, highres, anime coloring

  negative: >
    worst quality, low quality, lowres, bad anatomy, bad hands, extra digits,
    blurry, jpeg artifacts, text, watermark, signature, monochrome, sketch, 3d,
    multiple views

generation:
  sampler: dpmpp_sde
  scheduler: karras
  cfg: 7.5
  steps: 30

model:
  clip_skip: 2
  vae: vaeKlF8Anime2_klF8Anime2VAE.safetensors
