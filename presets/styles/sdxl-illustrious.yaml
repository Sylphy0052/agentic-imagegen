# SDXL / Illustrious系 (novaAnimeXL_ilV190、hassakuXL、waiNSFWIllustriousなど) 向けの画風preset。
# 実運用で使っている品質タグとネガティブプロンプトを持ち込む構成。
# 解像度とseedは再現性に直結するため、styleでは指定せずSpec側に任せる。
#
# タグはDanbooruに実在するものだけを使う (確認手順は .claude/skills/prompt-builder/references/common.md)。
# ultra-detailed / harsh lighting は実在しないため落とし、high res はDanbooruの表記
# highres へ、super deformed は chibi へ、extra fingers は extra digits へ置き換えている。
#
# negativeが23語あるのは実運用の設定をそのまま持ち込んでいるため。
# 色が抜けて眠い絵になる場合は後方から削る。
#
# negativeXL_D のようなTextual Inversion embeddingはまだ扱えないため、
# 相当する内容を素のタグへ展開している (Issue #59)。
#
# Illustrious系の配布元はclip skip 2を推奨するが、clip skipの指定は未対応 (Issue #60)。
# 既定は1相当のため、clip skip 1で運用している場合はそのまま再現できる。

description: Illustrious系SDXLの実運用設定。品質タグと定型ネガティブを積む

prompt:
  positive: >
    masterpiece, best quality, absurdres, highres

  negative: >
    chibi, bad anatomy, bad hands, extra digits, worst quality,
    low quality, normal quality, lowres, blurry, jpeg artifacts, watermark, text,
    logo, signature, speech bubble, 3d, photorealistic, lens flare,
    film grain, realistic, monochrome, censored, multiple views

generation:
  sampler: euler_ancestral
  scheduler: normal
  cfg: 7.0
  steps: 30

# vae は書かない。配置済みのVAEはSD1.5向けで、SDXLへ当てると成立しない。
model:
  clip_skip: 2
