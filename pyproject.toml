[project]
name = "agentic-imagegen"
version = "0.1.0"
description = "AIコーディングエージェントからComfyUI経由で画像生成を実行する基盤"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "typer>=0.12",
    "pillow>=11.0",
]

[project.optional-dependencies]
# MCP Serverとして使う場合のみ必要。CLI利用者には入れさせない。
mcp = ["mcp>=2.0"]

[project.scripts]
imagegen = "agentic_imagegen.cli:app"
imagegen-mcp = "agentic_imagegen.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "mcp>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_imagegen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
]
ignore = [
    "E501",  # line-length はformatterに委ねる
    # コメント・docstring・エラーメッセージを日本語で書くため、
    # 全角文字を「紛らわしい文字」として検出する規則は無効化する
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # テストでのassertを許可
# 例外名は要件で指定されたもの (InvalidGenerationSpec / ComfyUIUnavailable 等) を使う
"src/agentic_imagegen/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: ComfyUI起動環境が必要なテスト (通常のpytestではskip)",
]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/agentic_imagegen"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
