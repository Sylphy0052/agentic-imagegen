[project]
name = "agentic-imagegen"
version = "0.1.0"
description = "AIコーディングエージェントからComfyUI経由で画像生成を実行する基盤"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "typer>=0.12",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
# MCP Serverとして使う場合のみ必要。CLI利用者には入れさせない。
mcp = ["mcp>=2.0"]
# Diffusersバックエンドを使う場合のみ必要。ComfyUI経由で使う分には入れさせない。
# torchは数GBあるため、既定では入らないようにextraへ分けている。
diffusers = [
    "torch>=2.13",
    "diffusers>=0.39",
    "transformers>=4.50",
    "accelerate>=1.0",
    "peft>=0.17",
    "safetensors>=0.8",
    # torchの推移的依存だがPyPIには無い。tool.uv.sources は直接依存にしか効かないため、
    # ここへ明示して pytorch-xpu index から解決させる。
    "triton-xpu>=3.7; sys_platform == 'linux'",
]

[project.scripts]
imagegen = "agentic_imagegen.cli:app"
imagegen-mcp = "agentic_imagegen.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "mcp>=2.0",
    "fonttools>=4.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_imagegen"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
]
ignore = [
    "E501",  # line-length はformatterに委ねる
    # コメント・docstring・エラーメッセージを日本語で書くため、
    # 全角文字を「紛らわしい文字」として検出する規則は無効化する
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # テストでのassertを許可
# 例外名は要件で指定されたもの (InvalidGenerationSpec / ComfyUIUnavailable 等) を使う
"src/agentic_imagegen/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: ComfyUI起動環境が必要なテスト (通常のpytestではskip)",
]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/agentic_imagegen"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# torch (XPU版) が依存する triton-xpu はPython 3.15向けのwheelをまだ出していない。
# requires-python の上限を上げるとCLI利用者まで縛るため、解決対象の環境だけを絞る。
[tool.uv]
environments = ["python_version < '3.15'"]

# torchはPyPIのものではなくIntel XPU向けのビルドを使う。
# explicit = true にして、torch以外がこのindexから解決されないようにする。
[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

# torchが依存する triton-xpu もPyPIには無く、同じindexからしか取れない。
[tool.uv.sources]
torch = [{ index = "pytorch-xpu" }]
triton-xpu = [{ index = "pytorch-xpu" }]
