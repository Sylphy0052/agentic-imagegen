# A1111 (Stable Diffusion web UI) の実運用設定へ揃えたtxt2img。
#
# clip_skipと外部VAEは sd15-meinamix が持つため、Spec側にはcheckpointと
# hires fixだけを書く。hires fixは解像度に依存するためpresetへは置かない。
# 経緯は docs/prompting-guide.md の「A1111から設定を移す」を参照。
#
# 同じseedを指定してもA1111と同じ構図にはならない。初期ノイズをA1111はCPUで、
# ComfyUIはGPUで作るため、ノイズのパターン自体が別物になる。揃うのは絵柄まで。

version: "1"
task: txt2img

presets:
  style: sd15-meinamix

prompt:
  positive: >
    1girl, solo, standing, full body, looking at viewer,
    brown hair, high ponytail, brown eyes,
    sports bra, black leggings, running shoes,
    smile, dynamic pose, simple white background

generation:
  width: 512
  height: 768
  seed: -1
  upscale:
    model: RealESRGAN_x4plus_anime_6B.pth
    model_scale: 4.0
    scale: 2.0
    denoise: 0.65
    steps: 20
    method: lanczos

model:
  checkpoint: meinamix_v12Final.safetensors

output:
  prefix: a1111_compat
